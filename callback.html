<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Twitch Authentication</title>
</head>

<body>
    <h2 id="status">Processing Twitch authentication...</h2>

    <script>
        const status = document.getElementById("status");

        // Twitch puts the OAuth response after the # in the URL.
        const params = new URLSearchParams(
            window.location.hash.substring(1)
        );

        const token = params.get("access_token");
        const error = params.get("error");

        if (token) {

            // Send the token back to the window that opened this page.
            window.opener.postMessage(
                {
                    type: "twitch_auth",
                    access_token: token
                },
                "https://studio.penguinmod.com/"
            );

            status.textContent =
                "Authentication successful! You can close this window.";

            window.close();

        } else if (error) {

            status.textContent =
                "Twitch authentication failed: " + error;

        } else {

            status.textContent =
                "No access token was found.";
        }
    </script>
</body>
</html>
